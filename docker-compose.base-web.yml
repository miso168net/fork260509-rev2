# ⚠️ DEPRECATED — 本 standalone compose 已退場(Phase 1 #4 master compose 落地 2026-05-28)
# 主流用法:docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --wait
# 保留作 single-service debug 後備、未來不一定同步
#
# base-web 容器化 (Vue 3 starter,worktree + submodule)
#
# 用法:
#   dev 模式(熱重載,http://127.0.0.1:21079):
#     docker compose -f docker-compose.base-web.yml --profile dev up
#   prod 模式(build + nginx serve,http://127.0.0.1:21079):
#     docker compose -f docker-compose.base-web.yml --profile prod up --build
#   停止 + 移除容器:
#     docker compose -f docker-compose.base-web.yml --profile dev down
#     docker compose -f docker-compose.base-web.yml --profile prod down
#   清掉 named volume(強制下次重 pnpm install):
#     docker volume rm rev2-admin_base_web_node_modules
#
# 設計:
#   - 完全不需 host 裝 node/pnpm
#   - dev mode 用 named volume mask /app/node_modules,避免 WSL2 bind mount 拖慢 IO
#   - prod mode multi-stage build,Dockerfile 在 deploy/Dockerfile.base-web.txt
#   - 預設 .env.prod 指向 ApiFox Mock API(無需 rust-api),要連 local rust-api 自行改 base-web/.env.*

name: rev2-admin

services:
  base-web-dev:
    profiles: ["dev"]
    image: node:20.19-alpine
    container_name: rev2-admin-base-web-dev
    working_dir: /app
    environment:
      - NODE_ENV=development
      - COREPACK_ENABLE_DOWNLOAD_PROMPT=0
      - npm_config_store_dir=/pnpm-store
      - CI=true
    volumes:
      - ./base-web:/app
      - base_web_node_modules:/app/node_modules
      - base_web_pnpm_store:/pnpm-store
    ports:
      - "127.0.0.1:21079:21079"
    command:
      - sh
      - -c
      - "npm install -g pnpm@10 && pnpm install && pnpm dev --host 0.0.0.0 --port 21079"
    init: true
    tty: true
    stdin_open: true

  base-web-prod:
    profiles: ["prod"]
    build:
      context: ./base-web
      dockerfile: ../deploy/Dockerfile.base-web.txt
      args:
        VITE_SERVICE_BASE_URL: "${VITE_SERVICE_BASE_URL:-https://mock.apifox.cn/m1/3109515-0-default}"
    image: rev2-admin-base-web:latest
    container_name: rev2-admin-base-web
    ports:
      - "127.0.0.1:21079:21079"
    restart: unless-stopped

volumes:
  base_web_node_modules:
  base_web_pnpm_store:
