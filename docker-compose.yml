# rev2-admin master compose — base layer (5 service 共通定義)
#
# 用法:
#   dev:  docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --wait
#   prod: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --wait
#   prod + acme: docker compose -f docker-compose.yml -f docker-compose.prod.yml --profile prod up -d --wait
#
# 設計:
#   - base 層禁止放 host ports(R1: list append → dev/prod 疊加衝突)
#   - base 層禁止放 dev/prod 專屬 volume/bind-mount
#   - base-web 不放 image/build/command(dev=node:20 無 build;prod=nginx build;異質、無法靠 target 覆寫)
#   - rust-api 放 build(dev/prod 同 Dockerfile 不同 target,override 覆寫 build.target 即可)
#   - named volume 移除顯式 name:,靠 project name (rev2-admin) auto-prefix → 實際名 rev2-admin_<service>_<purpose>

name: rev2-admin

services:
  front-nginx:
    image: nginx:1.31.0-alpine
    depends_on:
      base-web:
        condition: service_healthy
      rust-api:
        condition: service_healthy
    healthcheck:
      # dev override 改 :21080(dev.conf 無 :80);prod 直接用(prod.conf 在 :80 先回 200 再 redirect)
      # 用 127.0.0.1 而非 localhost:alpine /etc/hosts 把 localhost 先解到 ::1(IPv6),
      # nginx listen 80 只綁 IPv4 → localhost 會 connection refused、healthcheck 永遠 fail
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health | grep -q ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - rev2_net

  base-web:
    # ★ image/build/command 故意不放 base 層(H1 base-web vs rust-api 差異):
    #   dev override → node:20.19-alpine(無 build);prod override → nginx multi-stage build
    #   異質不能靠 target 覆寫;若在 base 放 build,docker 會誤 build 並 tag 成 node:20
    depends_on: {}
    networks:
      - rev2_net

  rust-api:
    build:
      context: ./
      dockerfile: deploy/Dockerfile.rust-api.txt
      target: runtime
    image: rev2-admin-rust-api:latest
    depends_on:
      postgres:
        condition: service_healthy
      redis-stack:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      APP_JWT_JWT_SECRET_FILE: /run/secrets/jwt_secret
      APP_JWT_REFRESH_TOKEN_SECRET_FILE: /run/secrets/refresh_token_secret
      APP_DATABASE_URL_FILE: /run/secrets/database_url
      APP_REDIS_URL_FILE: /run/secrets/redis_url
      RUST_LOG: "info"
      # 015: xdb 來源地解析資料檔路徑。dev/prod 同一字串(dev 由 ./rust-api:/app bind-mount 提供、
      # prod 由 runtime stage COPY 進 WORKDIR /app),故於 base 層設一次即可
      XDB_FILEPATH: /app/xdb/resources/ip2region.xdb
    secrets:
      - jwt_secret
      - refresh_token_secret
      - database_url
      - redis_url
    networks:
      - rev2_net

  migrate:
    # ★ 一次性 migration service(007 FR-009:server 不自動 migrate)
    #   dev/prod override 各自提供 target: + command:;base 層只定義共通結構
    build:
      context: ./
      dockerfile: deploy/Dockerfile.rust-api.txt
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_DATABASE_URL_FILE: /run/secrets/database_url
    secrets:
      - database_url
    restart: "no"
    networks:
      - rev2_net

  cleanup-job:
    # ★ on-demand 維運 job(030):純過期 sys_token 清理。profile:[jobs] → 一般 up 不啟(FR-007);
    #   host cron / 人工觸發。dry-run 預設、--execute 才刪。鏡像 migrate 的 one-shot 結構。
    profiles: ["jobs"]
    build:
      context: ./
      dockerfile: deploy/Dockerfile.rust-api.txt
    image: rev2-admin-rust-api:latest
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_DATABASE_URL_FILE: /run/secrets/cleanup_database_url
    secrets:
      - cleanup_database_url
    command: ["cleanup-job"]
    restart: "no"
    networks:
      - rev2_net

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_USER: soybean
      POSTGRES_DB: soybean_admin_rust
    secrets:
      - postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U soybean"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - rev2_net

  redis-stack:
    image: redis/redis-stack-server:latest
    command:
      - sh
      - -c
      - 'redis-stack-server --requirepass "$(cat /run/secrets/redis_password)"'
    secrets:
      - redis_password
    volumes:
      - redis_stack_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$(cat /run/secrets/redis_password)\" --no-auth-warning ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - rev2_net

  acme:
    profiles: [prod]
    build:
      context: deploy/
      dockerfile: Dockerfile.acme.txt
    volumes:
      - front_nginx_certs:/acme.sh
    networks:
      - rev2_net

  loki:
    image: grafana/loki:3.7.2
    profiles: ["obs"]
    command: ["-config.file=/etc/loki/config.yml"]
    volumes:
      - loki_data:/loki
    restart: unless-stopped
    networks:
      - rev2_net

  alloy:
    image: grafana/alloy:v1.16.1
    profiles: ["obs"]
    # alloy reads the docker socket (root:docker, mode 660) to discover + tail all
    # container stdout; run as root for portable socket access. prod hardening
    # (non-root + group_add host docker gid) is deferred to obs-full / security pass (research R11).
    user: root
    command:
      - run
      - --storage.path=/var/lib/alloy/data
      - --server.http.listen-addr=0.0.0.0:12345
      - /etc/alloy/config.alloy
    volumes:
      - alloy_data:/var/lib/alloy/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki
    restart: unless-stopped
    networks:
      - rev2_net

  prometheus:
    image: prom/prometheus:v3.12.0
    profiles: ["metrics"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    volumes:
      - prometheus_data:/prometheus
    restart: unless-stopped
    networks:
      - rev2_net

  grafana:
    image: grafana/grafana:13.0.2
    profiles: ["obs", "metrics"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    secrets:
      - grafana_admin_password
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      # required: false — grafana 現跨 obs+metrics 兩 profile;metrics-only 啟動時 loki 不在
      # active set,長式 depends_on 容許目標缺席(在則等其啟動,不在則照常啟)。
      loki:
        condition: service_started
        required: false
    restart: unless-stopped
    networks:
      - rev2_net

networks:
  rev2_net:

volumes:
  postgres_data:
  redis_stack_data:
  front_nginx_certs:
  base_web_node_modules:
  base_web_pnpm_store:
  rust_api_cargo_cache:
  rust_api_target:
  loki_data:
  grafana_data:
  alloy_data:
  prometheus_data:

secrets:
  postgres_password:
    file: ./deploy/secrets/postgres_password.txt
  redis_password:
    file: ./deploy/secrets/redis_password.txt
  jwt_secret:
    file: ./deploy/secrets/jwt_secret.txt
  refresh_token_secret:
    file: ./deploy/secrets/refresh_token_secret.txt
  database_url:
    file: ./deploy/secrets/database_url.txt
  redis_url:
    file: ./deploy/secrets/redis_url.txt
  cleanup_database_url:
    file: ./deploy/secrets/cleanup_database_url.txt
  grafana_admin_password:
    file: ./deploy/secrets/grafana_admin_password.txt
